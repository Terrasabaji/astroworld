<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbc25f"/>
      <stop offset="100%" stop-color="#f5850e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#f5850e"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Inner glow -->
  <circle cx="60" cy="60" r="48" fill="url(#bg)" opacity="0.15"/>
  <!-- 12 zodiac division lines -->
  <g stroke="#ff9933" stroke-width="1" opacity="0.7">
    <line x1="60" y1="4" x2="60" y2="20"/>
    <line x1="88" y1="11" x2="79" y2="25"/>
    <line x1="109" y1="32" x2="95" y2="40"/>
    <line x1="116" y1="60" x2="100" y2="60"/>
    <line x1="109" y1="88" x2="95" y2="80"/>
    <line x1="88" y1="109" x2="79" y2="95"/>
    <line x1="60" y1="116" x2="60" y2="100"/>
    <line x1="32" y1="109" x2="41" y2="95"/>
    <line x1="11" y1="88" x2="25" y2="80"/>
    <line x1="4" y1="60" x2="20" y2="60"/>
    <line x1="11" y1="32" x2="25" y2="40"/>
    <line x1="32" y1="11" x2="41" y2="25"/>
  </g>
  <!-- South Indian chart diamond -->
  <polygon points="60,20 100,60 60,100 20,60" fill="none" stroke="#ff9933" stroke-width="1.5" opacity="0.6"/>
  <polygon points="60,35 85,60 60,85 35,60" fill="none" stroke="#fbc25f" stroke-width="1" opacity="0.4"/>
  <!-- Zodiac wheel ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#ff9933" stroke-width="1.2" opacity="0.5"/>
  <circle cx="60" cy="60" r="28" fill="none" stroke="#ff9933" stroke-width="1" opacity="0.4"/>
  <!-- Small dots at zodiac positions -->
  <g fill="#fbc25f" opacity="0.8">
    <circle cx="60" cy="18" r="2"/>
    <circle cx="81" cy="24" r="2"/>
    <circle cx="96" cy="39" r="2"/>
    <circle cx="102" cy="60" r="2"/>
    <circle cx="96" cy="81" r="2"/>
    <circle cx="81" cy="96" r="2"/>
    <circle cx="60" cy="102" r="2"/>
    <circle cx="39" cy="96" r="2"/>
    <circle cx="24" cy="81" r="2"/>
    <circle cx="18" cy="60" r="2"/>
    <circle cx="24" cy="39" r="2"/>
    <circle cx="39" cy="24" r="2"/>
  </g>
  <!-- Om symbol at center -->
  <text x="60" y="68" text-anchor="middle" font-size="28" font-family="serif" fill="#ff9933" font-weight="bold">ॐ</text>
  <!-- Outer decorative ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#fbc25f" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
</svg>
