<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Astro World">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 10" opacity="0.55"/>
  <!-- 12 zodiac ticks -->
  <g fill="url(#gold)" opacity="0.95">
    <circle cx="256" cy="58" r="7"/><circle cx="356" cy="88" r="6"/><circle cx="428" cy="168" r="6"/>
    <circle cx="454" cy="256" r="7"/><circle cx="428" cy="344" r="6"/><circle cx="356" cy="424" r="6"/>
    <circle cx="256" cy="454" r="7"/><circle cx="156" cy="424" r="6"/><circle cx="84" cy="344" r="6"/>
    <circle cx="58" cy="256" r="7"/><circle cx="84" cy="168" r="6"/><circle cx="156" cy="88" r="6"/>
  </g>
  <!-- South-Indian style chart diamond -->
  <g transform="translate(256 256)" stroke="url(#sky)" stroke-width="3" fill="none" opacity="0.85">
    <rect x="-72" y="-72" width="144" height="144" transform="rotate(45)"/>
    <line x1="-102" y1="0" x2="102" y2="0"/>
    <line x1="0" y1="-102" x2="0" y2="102"/>
  </g>
  <!-- Sun -->
  <circle cx="256" cy="256" r="34" fill="url(#gold)" filter="url(#glow)"/>
  <g stroke="#fef3c7" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="196" x2="256" y2="176"/><line x1="256" y1="316" x2="256" y2="336"/>
    <line x1="196" y1="256" x2="176" y2="256"/><line x1="316" y1="256" x2="336" y2="256"/>
    <line x1="214" y1="214" x2="200" y2="200"/><line x1="298" y1="298" x2="312" y2="312"/>
    <line x1="298" y1="214" x2="312" y2="200"/><line x1="214" y1="298" x2="200" y2="312"/>
  </g>
  <!-- Moon crescent -->
  <path d="M372 142a52 52 0 1 0 0 74a38 38 0 1 1 0-74z" fill="#e2e8f0" opacity="0.95"/>
  <!-- KP star lord dots -->
  <g fill="#38bdf8">
    <circle cx="120" cy="130" r="5"/><circle cx="392" cy="130" r="5"/>
    <circle cx="120" cy="382" r="5"/><circle cx="392" cy="382" r="5"/>
  </g>
  <!-- Orbit arc (transit) -->
  <path d="M96 300 A170 170 0 0 1 416 300" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Small planets on orbit -->
  <circle cx="130" cy="292" r="8" fill="#f472b6"/>
  <circle cx="256" cy="248" r="7" fill="#34d399"/>
  <circle cx="382" cy="292" r="8" fill="#fb923c"/>
</svg>
